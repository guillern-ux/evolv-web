<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservar visita | Evolv Real Estate</title>
<meta name="description" content="Reserva una visita a las casas en venta y alquiler de Evolv Real Estate en la Sierra de Madrid. Elige la casa y el día que prefieras.">
<link rel="canonical" href="https://evolvrealestate.com/reservar">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Evolv Real Estate">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="Reservar visita | Evolv Real Estate">
<meta property="og:description" content="Reserva una visita a las casas en venta y alquiler de Evolv Real Estate en la Sierra de Madrid. Elige la casa y el día que prefieras.">
<meta property="og:url" content="https://evolvrealestate.com/reservar">
<meta property="og:image" content="https://evolvrealestate.com/img/og-evolv.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=7">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>
.r-tipo { display: inline-flex; background: var(--lavanda); border-radius: 999px; padding: .3rem; gap: .2rem; }
.r-tipo label { position: relative; margin: 0; cursor: pointer; }
.r-tipo input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.r-tipo span { display: block; padding: .55rem 1.4rem; border-radius: 999px; font-weight: 700; color: var(--morado-medio); transition: .2s; }
.r-tipo input:checked + span { background: var(--morado); color: #fff; }
.r-tipo input:focus-visible + span { outline: 2px solid var(--morado); outline-offset: 2px; }
.r-casas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .7rem; max-height: 430px; overflow-y: auto; padding: .2rem; }
.r-casa { position: relative; display: flex !important; align-items: center; gap: .8rem; margin: 0 !important; padding: .6rem; border: 2px solid #e4e0ec; border-radius: 14px; background: #fff; cursor: pointer; transition: border-color .2s, background .2s; font-weight: 400 !important; }
.r-casa:hover { border-color: var(--morado-medio); }
.r-casa input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.r-casa img, .r-casa .r-ico { width: 72px; height: 60px; border-radius: 10px; object-fit: cover; flex: none; background: var(--lavanda); }
.r-casa .r-ico { display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; color: var(--morado); }
.r-info { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.r-info b { color: var(--morado); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-info small { color: var(--morado-medio); font-size: .82rem; }
.r-info em { font-style: normal; font-weight: 800; color: var(--texto); font-size: .92rem; margin-top: .15rem; }
.r-info em small { font-weight: 600; }
.r-check { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #cfc9da; flex: none; transition: .2s; }
.r-casa:has(input:checked) { border-color: var(--morado); background: #f4f1f9; }
.r-casa:has(input:checked) .r-check { border: 6px solid var(--morado); }
.r-casa:has(input:focus-visible) { outline: 2px solid var(--morado); outline-offset: 2px; }
</style>
</head>
<body>

<main class="contenedor">
  <div class="cabecera-pagina">
    <h1 class="titulo">Visita exclusiva a nuestros inmuebles</h1>
    <p>Descubre en exclusiva los inmuebles de Evolv Real Estate en la Sierra de Madrid. Visita de 1 h.</p>
  </div>
  <div class="caja-form" style="margin-bottom:6rem">
    <div class="aviso-ok">¡Solicitud recibida! Te confirmaremos la visita por teléfono o email.</div>
    <form class="formulario" data-asunto="Solicitud de visita">
      <div><label for="r-nombre">Nombre *</label><input id="r-nombre" name="Nombre" required></div>
      <div><label for="r-tel">Teléfono *</label><input id="r-tel" type="tel" name="Teléfono" required></div>
      <div class="completo"><label for="r-email">Email *</label><input id="r-email" type="email" name="email" required></div>
      <div class="completo"><label>¿Qué te interesa? *</label>
        <div class="r-tipo" role="radiogroup" aria-label="Comprar o alquilar">
          <label><input type="radio" name="Operación" value="Comprar" checked><span>Comprar</span></label>
          <label><input type="radio" name="Operación" value="Alquilar"><span>Alquilar</span></label>
        </div>
      </div>
      <div class="completo"><label id="r-casas-titulo">¿Qué casa quieres visitar? *</label>
        <div class="r-casas" id="r-casas" role="radiogroup" aria-labelledby="r-casas-titulo"><p class="legal">Cargando casas…</p></div>
        <input type="hidden" name="Enlace del inmueble" id="r-enlace">
      </div>
      <div><label for="r-fecha">Fecha preferida *</label><input id="r-fecha" type="date" name="Fecha" required></div>
      <div><label for="r-hora">Franja horaria</label>
        <select id="r-hora" name="Franja"><option>Mañana (9:00–14:00)</option><option>Tarde (16:00–20:00)</option><option>Me da igual</option></select>
      </div>
      <div class="completo"><label for="r-msg">Comentarios</label><textarea id="r-msg" name="Comentarios"></textarea></div>
      <p class="legal completo"><label style="display:flex;gap:.5rem;font-weight:400"><input type="checkbox" required style="width:auto"> He leído y acepto la <a href="privacidad.html">política de privacidad</a>.</label></p>
      <button class="boton" type="submit">Solicitar visita</button>
    </form>
  </div>
</main>

<script src="/js/datos.js?v=3"></script>
<script src="/js/main.js?v=5"></script>
<script>
document.getElementById("r-fecha").min = new Date().toISOString().split("T")[0];

listo.then(() => {
  const q = new URLSearchParams(location.search);
  const caja = document.getElementById("r-casas");
  const enlace = document.getElementById("r-enlace");
  const abiertas = (l) => l.filter((p) => p.estado !== "Vendida" && p.estado !== "Alquilada");
  const valor = (p) => `${p.nombre} (${p.zona})`;

  function pintar(tipo, marcarId) {
    const alq = tipo === "alquiler";
    const lista = abiertas(alq ? ALQUILER : VENTA);
    caja.innerHTML = lista.map((p) => `
      <label class="r-casa">
        <input type="radio" name="Inmueble" value="${esc(valor(p))} · ${euros(p.precio)}${alq ? "/mes" : ""}" data-url="${location.origin}/${p.tipo}/${p.id}" data-id="${p.id}" required>
        <img src="${esc(p.img)}" alt="" loading="lazy">
        <span class="r-info"><b>${esc(p.nombre)}</b>
          <small>${esc(p.zona)}${p.hab ? ` · ${p.hab} hab.` : ""}${p.m2 ? ` · ${p.m2} m²` : ""}</small>
          <em>${euros(p.precio)}${alq ? "<small>/mes</small>" : ""}</em></span>
        <span class="r-check" aria-hidden="true"></span>
      </label>`).join("") + `
      <label class="r-casa r-otra">
        <input type="radio" name="Inmueble" value="Aún no lo sé / quiero ver varias (${alq ? "alquiler" : "compra"})" data-url="" required>
        <span class="r-ico" aria-hidden="true">?</span>
        <span class="r-info"><b>Aún no lo sé</b><small>Quiero ver varias o que me ayudéis a elegir</small></span>
        <span class="r-check" aria-hidden="true"></span>
      </label>`;
    enlace.value = "";
    if (marcarId) {
      const r = caja.querySelector(`input[data-id="${CSS.escape(marcarId)}"]`);
      if (r) { r.checked = true; enlace.value = r.dataset.url; r.closest(".r-casa").scrollIntoView({ block: "nearest" }); }
    }
  }

  caja.addEventListener("change", (e) => { if (e.target.name === "Inmueble") enlace.value = e.target.dataset.url || ""; });
  document.querySelectorAll('input[name="Operación"]').forEach((r) =>
    r.addEventListener("change", () => pintar(r.value === "Alquilar" ? "alquiler" : "venta")));

  // Si viene desde la ficha de una casa, la dejamos marcada
  let tipo = q.get("tipo") === "alquiler" ? "alquiler" : "venta";
  let id = q.get("id");
  const nombre = q.get("inmueble");
  if (!id && nombre) {
    const todas = [...VENTA, ...ALQUILER];
    const p = todas.find((x) => valor(x) === nombre) || todas.find((x) => nombre.startsWith(x.nombre));
    if (p) { id = p.id; tipo = p.tipo; }
  }
  if (tipo === "alquiler") document.querySelector('input[name="Operación"][value="Alquilar"]').checked = true;
  pintar(tipo, id);
});
</script>
</body>
</html>
