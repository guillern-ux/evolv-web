listo.then(() => {

    <ul>
      ${fila("Titular", c.titular)}

      ${fila("NIF", c.nif)}
      ${fila("Domicilio", c.domicilio || c.direccion)}
      ${fila("Email", c.email)}
      ${fila("Teléfono", c.telefono)}
      ${fila("Sitio web", location.hostname)}
    </ul>

    <h2>2. Objeto</h2>
    <p>Este sitio web tiene como finalidad dar a conocer los servicios de intermediación inmobiliaria de ${esc(c.nombre || "Evolv Real Estate")} en la compra, venta y alquiler de viviendas, así como facilitar el contacto con los usuarios interesados.</p>

    <h2>3. Condiciones de uso</h2>
    <p>El acceso a este sitio web es gratuito y atribuye la condición de usuario, que acepta este aviso legal. El usuario se compromete a hacer un uso adecuado de los contenidos y a no emplearlos para actividades ilícitas o contrarias a la buena fe.</p>

    <h2>4. Información de los inmuebles</h2>
    <p>Los datos de los inmuebles (precios, superficies, características y fotografías) son orientativos y pueden cambiar sin previo aviso. No constituyen una oferta contractual vinculante. Para información detallada y actualizada, contacta con nosotros.</p>

    <h2>5. Propiedad intelectual e industrial</h2>
    <p>Los textos, imágenes, logotipos y diseño de este sitio web son propiedad del titular o se usan con autorización. Queda prohibida su reproducción, distribución o modificación sin permiso expreso.</p>

    <h2>6. Responsabilidad</h2>
    <p>El titular no se hace responsable de los daños que pudieran derivarse de interrupciones del servicio, errores en los contenidos o del uso de enlaces a sitios de terceros, sobre los que no tiene control.</p>

    <h2>7. Protección de datos</h2>
    <p>El tratamiento de los datos personales que facilites a través de los formularios se rige por nuestra <a href="privacidad.html">Política de Privacidad</a>.</p>

    <h2>8. Legislación aplicable</h2>
    <p>Este aviso legal se rige por la legislación española. Para cualquier controversia, las partes se someten a los juzgados y tribunales que correspondan conforme a la normativa vigente.</p>`;
});
